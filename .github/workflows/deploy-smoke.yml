name: Deploy Smoke Test

on:
  push:
    branches: [toybattles_mvsurge]
  pull_request:
    branches: [toybattles_mvsurge]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use localhost config for CI
        run: sed -i 's/123\.456\.78\.9/127.0.0.1/g' Setup/config.ini

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deploy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: toybattles-emu:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name toybattles \
            -e MV_DB_PW=ci_test_password \
            -e MV_JWT=ci_dummy_jwt_secret \
            -e MV_DB_PORT=3305 \
            toybattles-emu:ci

      - name: Wait for database initialization
        run: |
          for i in $(seq 1 150); do
            if docker exec toybattles test -f /run/db_ready; then
              echo "Database initialized."
              exit 0
            fi
            if [ -z "$(docker ps -q --filter name=toybattles --filter status=running)" ]; then
              echo "::error::Container exited before the database was ready"
              docker logs toybattles
              exit 1
            fi
            sleep 2
          done
          echo "::error::Timed out waiting for database initialization"
          docker logs toybattles
          exit 1

      - name: Verify all servers start and stay up (no crash loop)
        run: |
          sleep 25
          for s in AuthServer MainServer CastServer; do
            if ! docker exec toybattles pgrep -f "$s.elf" >/dev/null; then
              echo "::error::$s failed to start"
              docker logs toybattles
              exit 1
            fi
          done
          pids1=$(docker exec toybattles sh -c 'pgrep -f AuthServer.elf; pgrep -f MainServer.elf; pgrep -f CastServer.elf' | sort)
          sleep 25
          pids2=$(docker exec toybattles sh -c 'pgrep -f AuthServer.elf; pgrep -f MainServer.elf; pgrep -f CastServer.elf' | sort)
          if [ "$pids1" != "$pids2" ]; then
            echo "::error::A server restarted within the observation window (likely a crash loop)"
            docker logs toybattles
            exit 1
          fi
          echo "All three servers are running and stable."

      - name: Check logs for database connection errors
        run: |
          if docker logs toybattles 2>&1 | grep -iE "Error connecting to MariaDB|MariaDB exception"; then
            echo "::error::Database connection errors found in server logs"
            exit 1
          fi
          echo "No database connection errors."

      - name: Dump container logs
        if: always()
        run: docker logs toybattles || true

      - name: Cleanup
        if: always()
        run: docker rm -f toybattles || true
