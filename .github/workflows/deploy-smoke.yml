name: Deploy Smoke Test

on:
  push:
    branches: [toybattles_mvsurge]
  pull_request:
    branches: [toybattles_mvsurge]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deploy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: toybattles-emu:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure LocalIp to match detected outbound IP
        run: |
          HOST_IP=$(ip -4 route get 8.8.8.8 | grep -oP 'src \K[0-9.]+' | head -1)
          echo "Detected outbound IP: $HOST_IP"
          sed -i "s/^LocalIp[[:space:]]*=.*/LocalIp = $HOST_IP/" Setup/config.ini
          grep -n "LocalIp" Setup/config.ini

      - name: Run container
        run: |
          docker run -d --name toybattles --network host \
            -e MV_DB_PW=ci_test_password \
            -e MV_JWT=ci_dummy_jwt_secret \
            -e MV_DB_PORT=3305 \
            -v "$PWD/Setup/config.ini:/app/emu/Setup/config.ini:ro" \
            toybattles-emu:ci

      - name: Wait for database initialization
        run: |
          for i in $(seq 1 180); do
            if docker exec toybattles test -f /run/db_ready 2>/dev/null; then
              echo "Database initialized."
              exit 0
            fi
            if [ -z "$(docker ps -q --filter name=toybattles --filter status=running)" ]; then
              echo "::error::Container exited before the database was ready"
              docker logs toybattles
              exit 1
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- still waiting (${i}/180), recent logs: ---"
              docker logs --tail 15 toybattles 2>&1 || true
            fi
            sleep 4
          done
          echo "::error::Timed out waiting for database initialization"
          docker logs toybattles
          exit 1

      - name: Verify all servers start and stay up (no crash loop)
        run: |
          sleep 25
          for s in AuthServer MainServer CastServer; do
            if ! docker exec toybattles pgrep -f "$s.elf" >/dev/null; then
              echo "::error::$s failed to start"
              docker logs toybattles
              exit 1
            fi
          done
          pids1=$(docker exec toybattles sh -c 'pgrep -f AuthServer.elf; pgrep -f MainServer.elf; pgrep -f CastServer.elf' | sort)
          sleep 25
          pids2=$(docker exec toybattles sh -c 'pgrep -f AuthServer.elf; pgrep -f MainServer.elf; pgrep -f CastServer.elf' | sort)
          if [ "$pids1" != "$pids2" ]; then
            echo "::error::A server restarted within the observation window (likely a crash loop)"
            docker logs toybattles
            exit 1
          fi
          echo "All three servers are running and stable."

      - name: Check logs for fatal errors
        run: |
          if docker logs toybattles 2>&1 | grep -iE "Error connecting to MariaDB|MariaDB exception|Could not retrieve|Sanity check failed"; then
            echo "::error::Fatal startup/database errors found in server logs"
            exit 1
          fi
          echo "No fatal errors."

      - name: Dump container logs
        if: always()
        run: docker logs toybattles || true

      - name: Cleanup
        if: always()
        run: docker rm -f toybattles || true
